<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Go Fish">
  <defs>
    <linearGradient id="gf-felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8763"/>
      <stop offset="1" stop-color="#15503a"/>
    </linearGradient>
    <linearGradient id="gf-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7bd5a"/>
      <stop offset="1" stop-color="#e2922a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#gf-felt)"/>
  <!-- card back -->
  <g transform="rotate(13 40 32)">
    <rect x="27" y="11" width="27" height="40" rx="4.5" fill="#0d3a29" opacity=".35" transform="translate(1.2 1.6)"/>
    <rect x="27" y="11" width="27" height="40" rx="4.5" fill="url(#gf-back)"/>
    <rect x="30" y="14" width="21" height="34" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
  </g>
  <!-- card face -->
  <g transform="rotate(-8 26 33)">
    <rect x="10" y="11" width="32" height="44" rx="5" fill="#0d3a29" opacity=".35" transform="translate(1.2 1.8)"/>
    <rect x="10" y="11" width="32" height="44" rx="5" fill="#fffdf8"/>
    <!-- fish -->
    <path d="M13 34 C17.5 25.5 29.5 25.5 34 34 C29.5 42.5 17.5 42.5 13 34 Z" fill="#1f6b4f"/>
    <path d="M32.6 34 L39.5 27.2 Q37.6 34 39.5 40.8 Z" fill="#1f6b4f"/>
    <circle cx="18.6" cy="32.4" r="1.7" fill="#fffdf8"/>
    <path d="M23.4 29.4 Q25.9 34 23.4 38.6" fill="none" stroke="#fffdf8" stroke-width="1.4" stroke-linecap="round"/>
    <!-- corner suit -->
    <path d="M14.4 16.2 c0 -1.8 2.6 -2.1 2.9 -0.2 c0.3 -1.9 2.9 -1.6 2.9 0.2 c0 1.8 -2.9 3.5 -2.9 3.8 c0 -0.3 -2.9 -2 -2.9 -3.8 Z" fill="#c62f3a"/>
  </g>
</svg>
